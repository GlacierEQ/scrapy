<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Scraper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <h1>Advanced Web Scraper</h1>
            <div class="nav-controls">
                <button class="theme-toggle tooltip" onclick="toggleTheme()" aria-label="Toggle theme">
                    <span class="tooltip-text">Toggle dark/light mode</span>
                    <span id="theme-toggle-icon">🌙</span>
                </button>
                <a href="/settings" class="tooltip">
                    <span class="tooltip-text">Configure scraper settings</span>
                    ⚙️ Settings
                </a>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showForm('jefs')">
                <span class="tab-icon">⚖️</span> Hawaii JEFS Scraper
            </button>
            <button class="tab" onclick="showForm('general')">
                <span class="tab-icon">🌐</span> General Web Scraper
            </button>
        </div>
        
        <div id="jefsForm" class="form-container active">
            <form id="scrapeJefsForm" onsubmit="handleJefsSubmit(event)">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit">
                    <span class="button-icon">🔒</span> Login and Scrape JEFS
                </button>
            </form>
        </div>
        
        <div id="generalForm" class="form-container">
            <form id="scrapeGeneralForm" onsubmit="handleGeneralSubmit(event)">
                <div class="form-group">
                    <label for="url">Website URL:</label>
                    <input type="url" id="url" name="url" class="form-control" required 
                           placeholder="https://example.com">
                </div>
                
                <div class="checkbox-group">
                    <label class="checkbox-label tooltip">
                        <input type="checkbox" id="followLinks" name="followLinks">
                        <span class="tooltip-text">Scrape linked pages up to the configured limit</span>
                        Follow Links
                    </label>
                    <label class="checkbox-label tooltip">
                        <input type="checkbox" id="compileText" name="compileText">
                        <span class="tooltip-text">Generate a comprehensive analysis report</span>
                        Compile Analysis
                    </label>
                </div>
                
                <button type="submit">
                    <span class="button-icon">🔍</span> Analyze Website
                </button>
            </form>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing your request... Please wait...</p>
        </div>

        <div id="status" class="status"></div>
        
        <div id="results" class="results-grid"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
